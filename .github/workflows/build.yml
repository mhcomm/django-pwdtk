name: django-pwdtk CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
        - uses: actions/checkout@v4
        - name: setup python
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"
            architecture: x64
        - name: install dependencies
          run: |
            python -m pip install -U pip
            python -m pip install flake8
        - name: flake
          run: |
            python -m flake8 pwdtk setup.py

  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.12"]
        # only the long term support releases of django are tested
        django-version: ["dj22", "dj32", "dj42", "dj52"]
        exclude:
            # django 2.2 supports no python beyond 3.9, django 3.2 none
            # beyond 3.10
          - python-version: "3.12"
            django-version: "dj22"
          - python-version: "3.12"
            django-version: "dj32"
            # django 5.2 requires python 3.10 or a more recent one
          - python-version: "3.8"
            django-version: "dj52"
          - python-version: "3.9"
            django-version: "dj52"
    steps:
        - uses: actions/checkout@v4
        - name: setup python
          uses: actions/setup-python@v5
          with:
            python-version: ${{ matrix.python-version }}
            architecture: x64
        - name: install dependencies
          run: |
            python -m pip install -U pip
            python -m pip install pytz
        # - name: check import order
        #   if: ${{ matrix.django-version = "dj21' }}
        #   run: |
        #     python -m pip install isort
        #     python -m isort --show-files setup.py pwdtk
        #     python -m isort --diff --check setup.py pwdtk
        - name: pytest
          run: |
            python -m pip install wheel
            python -m pip install -r requirements/tox_${{ matrix.django-version }}.txt
            python -m pip install -e .
            DJANGO_SETTINGS_MODULE=pwdtk.testproject.${{ matrix.django-version }}.settings pytest

  coverage:
    # a coverage report does not depend on the python nor the django version,
    # hence it is only measured once, with the most recent ones
    # forked pull requests are skipped, as they cannot report their coverage
    if: >-
      (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository)
      || github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write  # to publish and update the coverage comment
      contents: write  # to push the coverage data to its own branch
    steps:
        - uses: actions/checkout@v2
        - name: setup python
          uses: actions/setup-python@v2
          with:
            python-version: "3.9"
            architecture: x64
        - name: install dependencies
          run: |
            python -m pip install -U pip
            python -m pip install wheel
            python -m pip install pytest-cov
            python -m pip install -r requirements/tox_dj42.txt
            python -m pip install -e .
        - name: pytest
          run: |
            DJANGO_SETTINGS_MODULE=pwdtk.testproject.dj42.settings pytest --cov
        - name: report the coverage
          uses: py-cov-action/python-coverage-comment-action@a05be3d2e8a6272d3ef5fb2840ab20368bb2eb71  # v4.3
          with:
            GITHUB_TOKEN: ${{ github.token }}
